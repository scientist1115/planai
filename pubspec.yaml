name: planai
description: 말만 하면 계획이 완성되는 AI 플래너
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  table_calendar: ^3.1.2
  intl: any
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  sign_in_with_apple: ^6.1.2
  crypto: ^3.0.5
  flutter_naver_login: '>=1.8.0 <2.0.0'
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
